<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <title>Vinteum - Learning Lab</title>
    <meta
      name="description"
      content="Vinteum - Open Source Bitcoin Development."
    />
    <link rel="canonical" href="https://vinteum.org/" />

    <!--
      Link unfurls are driven entirely by these static tags. Slack, Discord and X
      don't execute JavaScript, and Vite serves this same file for every route,
      so per-page og: tags are not possible without prerendering. usePageMeta()
      updates the title/description client-side for browser tabs and Google only.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vinteum" />
    <meta property="og:title" content="Vinteum Learning Lab" />
    <meta
      property="og:description"
      content="Vinteum - Open Source Bitcoin Development."
    />
    <meta property="og:url" content="https://learning.vinteum.org/" />
    <meta property="og:image" content="https://www.vinteum.org/assets/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vinteum - Open Source Bitcoin Development." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@vinteum_org" />
    <meta name="twitter:creator" content="@vinteum_org" />
    <meta name="twitter:title" content="@vinteum_org" />
    <meta
      name="twitter:description"
      content="Vinteum - Open Source Bitcoin Development."
    />
    <meta name="twitter:image" content="https://vinteum.org/assets/images/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body class="m-0 p-0 font-mono" style="background-color: #000">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
